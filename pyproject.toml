[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brasileirao-predictions"
version = "0.1.0"
description = "Modelo preditivo e simulador de temporadas do Campeonato Brasileiro Série A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
sources = ["httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9", "pandas-stubs", "flake8>=7", "pylint>=3"]

[project.scripts]
brasileirao = "brasileirao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brasileirao = ["competition_rules/seasons/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: testes que executam pipeline completo com dados reais"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "apps", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "UP046", "UP047", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["brasileirao"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = ["too-many-arguments", "too-many-locals", "too-few-public-methods", "too-many-positional-arguments"]
