# Publica o site estático no GitHub Pages (ADR-0007; ADR-0008, passo 13 e adendo da Decisão 3).
#
# Cada execução reconstrói do zero, num runner efêmero, toda a história da temporada: ingestão das
# fontes licenciadas, um snapshot por rodada e a revisão rodada a rodada, com semente fixa. Nada é
# guardado entre execuções: sem repositório de estado, sem SQLite em artefato, sem cache de dados.
#
# Interruptores (configurados pelo dono do produto; ver docs/architecture/deploy.md):
# - secret  FOOTBALL_DATA_ORG_TOKEN: chave do football-data.org (cláusula 6.1 do ADR-0008);
# - variável PUBLISH_ENABLED = 'true': liga o agendamento, o upload e o deploy. Sem ela, só roda
#   manualmente (workflow_dispatch) como ensaio: reconstrói, passa no gate e não publica nada.
#
# O atualizar-rodada.yml (ADR-0009) dispara este workflow com `trigger=match` e os IDs dos jogos que
# acabaram; o run-name mostra o gatilho no histórico do Actions.
name: publish-site
run-name: "publish-site (${{ inputs.trigger || github.event_name }}${{ inputs.match_ids && format(': {0}', inputs.match_ids) || '' }})"

on:
  schedule:
    # Todo dia, 06:17 em Brasília: cobre os jogos da noite anterior. Fora do minuto 0, em que a fila de
    # agendamentos do GitHub costuma atrasar ou pular execuções.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Temporada (vazio = a do arquivo)"
        required: false
        default: ""
      trigger:
        description: "Gatilho (manual ou match)"
        type: choice
        options: [manual, match]
        default: manual
      match_ids:
        description: "IDs do football-data.org separados por vírgula (só com trigger=match)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

env:
  SEASON: ${{ inputs.season || '2026' }}
  SIMULATIONS: "100000"
  HISTORY_SIMULATIONS: "10000"
  ROUND_REVIEW_SIMULATIONS: "20000"
  SEED: "2026"
  PYTHONUTF8: "1"

jobs:
  build:
    # Só na main. O agendamento só trabalha com a publicação ligada (evita gastar minutos em repo privado).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Os inputs só entram por variável de ambiente e são conferidos antes de qualquer outro passo.
      - name: Conferir os inputs
        env:
          TRIGGER: ${{ inputs.trigger }}
          MATCH_IDS: ${{ inputs.match_ids }}
        run: |
          [[ "$TRIGGER" =~ ^(manual|match)?$ ]] || { echo "trigger inválido"; exit 1; }
          [[ "$MATCH_IDS" =~ ^([0-9]{1,12}(,[0-9]{1,12}){0,19})?$ ]] || { echo "match_ids inválido"; exit 1; }
          echo "gatilho: ${TRIGGER:-$GITHUB_EVENT_NAME}; jogos: ${MATCH_IDS:-nenhum}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -e ".[api,sources,dev]"

      - name: Testes (antes de qualquer dado real no runner)
        run: pytest -q

      # O SQLite dos snapshots fica fora do checkout, num diretório novo: nenhum snapshot criado pelos
      # testes (ou deixado no checkout) entra no export.
      - name: Isolar o banco de snapshots
        run: |
          rm -rf data/snapshots
          mkdir -p "$RUNNER_TEMP/snapshots"
          echo "BRASILEIRAO_SNAPSHOT_DB=$RUNNER_TEMP/snapshots/snapshots.sqlite" >> "$GITHUB_ENV"

      - name: Baixar Adão Duque v18 do Kaggle e conferir SHA-256
        run: >-
          python -I infrastructure/scripts/fetch_adaoduque_v18.py
          --pins data/reference/source_pins.json
          --target data/raw/adaoduque/v18

      - name: Ingestão de publicação
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python -m brasileirao.cli ingest --fetch --season "$SEASON"

      - name: Validar
        run: python -m brasileirao.cli validate

      - name: Reconstruir a história (um snapshot por rodada) e o snapshot atual
        run: >-
          python -m brasileirao.cli simulate --season "$SEASON"
          --simulations "$SIMULATIONS" --seed "$SEED"
          --history-from-round 1 --history-simulations "$HISTORY_SIMULATIONS"

      - name: Revisão rodada a rodada
        run: >-
          python -m brasileirao.cli review-rounds --season "$SEASON"
          --simulations "$ROUND_REVIEW_SIMULATIONS" --seed "$SEED"

      - name: Exportar
        run: python -m brasileirao.cli export-web --season "$SEASON"

      - name: Montar o artefato (só o site estático e o export)
        run: |
          rm -rf _site
          cp -r apps/web _site
          find _site -type f | sort > "$RUNNER_TEMP/site-files.txt"
          echo "arquivos no artefato: $(wc -l < "$RUNNER_TEMP/site-files.txt"), $(du -sh _site | cut -f1)"

      - name: Gate de publicação G1 a G5 (ADR-0008)
        run: >-
          python -m brasileirao.cli publication-gate --season "$SEASON"
          --gold data/gold/matches_model.csv
          --composition data/silver/sources.json
          --predictions "_site/data/api/seasons/$SEASON/predictions.json"
          --artifact-dir _site

      # A URL do site no ar sai de GITHUB_REPOSITORY ("dono/nome"), definido em todo evento. O
      # github.event.repository.* pode vir vazio no schedule e faria a checagem de regressão ser pulada.
      - name: Checagens do artefato (ADR-0007, itens 5, 6 e 8)
        run: |
          live_url="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/data/api/seasons/${SEASON}/predictions.json"
          python -I infrastructure/scripts/check_site_artifact.py \
            --site-dir _site --season "$SEASON" --seed "$SEED" --live-url "${live_url,,}"

      # Série B (ADR-0010): pipeline e site próprios em _site/serie-b. Fontes sem segredo (openfootball
      # fixado por commit e Wikipédia). Uma falha aqui não bloqueia a Série A: o passo seguinte mantém o
      # forecast.json que já está no ar.
      - name: Série B — ingestão, previsão e gate
        id: serie_b
        continue-on-error: true
        run: |
          python -m brasileirao.serie_b.cli ingest --fetch
          python -m brasileirao.serie_b.cli forecast --simulations "$SIMULATIONS" --seed "$SEED"
          rm -rf "$RUNNER_TEMP/serie-b"
          cp -r apps/web-serie-b "$RUNNER_TEMP/serie-b"
          rm -rf "$RUNNER_TEMP/serie-b/data"
          python -m brasileirao.serie_b.cli export-web --target "$RUNNER_TEMP/serie-b/data"
          live_url="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/serie-b/data/forecast.json"
          live_date="$(curl -fsS "${live_url,,}" 2>/dev/null | jq -r '.reference_date // empty' 2>/dev/null || true)"
          [ -n "$live_date" ] || echo "::warning::Série B: sem forecast.json no ar; checagem de não regressão pulada"
          python -m brasileirao.serie_b.cli gate --site-dir "$RUNNER_TEMP/serie-b" ${live_date:+--live-reference-date "$live_date"}

      - name: Série B — incluir no artefato
        env:
          SERIE_B_OUTCOME: ${{ steps.serie_b.outcome }}
        run: |
          if [ "$SERIE_B_OUTCOME" = "success" ]; then
            cp -r "$RUNNER_TEMP/serie-b" _site/serie-b
            echo "Série B: previsão nova"
            exit 0
          fi
          live_url="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/serie-b/data/forecast.json"
          cp -r apps/web-serie-b _site/serie-b
          rm -rf _site/serie-b/data
          mkdir -p _site/serie-b/data
          # O forecast.json antigo só volta ao ar se passar no gate do próprio forecast com o app novo
          # (esquema, somas, aritmética); senão /serie-b sai do artefato.
          if curl -fsS "${live_url,,}" -o _site/serie-b/data/forecast.json \
            && python -m brasileirao.serie_b.cli gate --standalone --site-dir _site/serie-b; then
            echo "::warning::Série B falhou; mantido o forecast.json do site no ar"
          else
            rm -rf _site/serie-b
            echo "::warning::Série B falhou e não há versão válida no ar; o site sai sem /serie-b"
          fi

      # Ligas europeias (ADR-0011): histórico do openfootball fixado por commit e temporada corrente do
      # football-data.org (mesma chave da Série A, só neste passo de ingestão). Cada liga falha sozinha,
      # sem bloquear a Série A, a Série B nem a outra liga.
      - name: Ingestão das ligas europeias
        id: leagues_ingest
        continue-on-error: true
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          for league in premier-league la-liga; do
            if python -m brasileirao.leagues.cli "$league" ingest --fetch; then
              touch "$RUNNER_TEMP/ingest-ok-$league"
            else
              echo "::warning::$league: ingestão falhou"
            fi
          done

      - name: Ligas europeias — previsão e gate
        id: leagues
        continue-on-error: true
        run: |
          for league in premier-league la-liga; do
            [ -f "$RUNNER_TEMP/ingest-ok-$league" ] || continue
            site="$RUNNER_TEMP/site-$league"
            live_url="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/$league/data/forecast.json"
            if (
              set -e
              python -m brasileirao.leagues.cli "$league" forecast --simulations "$SIMULATIONS" --seed "$SEED"
              rm -rf "$site"
              cp -r apps/web-ligas "$site"
              rm -rf "$site/data"
              python -m brasileirao.leagues.cli "$league" export-web --target "$site/data"
              live_date="$(curl -fsS "${live_url,,}" 2>/dev/null | jq -r '.reference_date // empty' 2>/dev/null || true)"
              [ -n "$live_date" ] || echo "::warning::$league: sem forecast.json no ar; checagem de não regressão pulada"
              python -m brasileirao.leagues.cli "$league" gate --site-dir "$site" ${live_date:+--live-reference-date "$live_date"}
            ); then
              touch "$RUNNER_TEMP/league-ok-$league"
            else
              echo "::warning::$league: previsão ou gate falhou"
            fi
          done

      # Liga que falhou: o forecast.json no ar só volta com o app novo se passar no gate --standalone.
      - name: Ligas europeias — incluir no artefato
        run: |
          for league in premier-league la-liga; do
            if [ -f "$RUNNER_TEMP/league-ok-$league" ]; then
              cp -r "$RUNNER_TEMP/site-$league" "_site/$league"
              echo "$league: previsão nova"
              continue
            fi
            live_url="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/$league/data/forecast.json"
            cp -r apps/web-ligas "_site/$league"
            rm -rf "_site/$league/data"
            mkdir -p "_site/$league/data"
            if curl -fsS "${live_url,,}" -o "_site/$league/data/forecast.json" \
              && python -m brasileirao.leagues.cli "$league" gate --standalone --site-dir "_site/$league"; then
              echo "::warning::$league falhou; mantido o forecast.json do site no ar"
            else
              rm -rf "_site/$league"
              echo "::warning::$league falhou e não há versão válida no ar; o site sai sem /$league"
            fi
          done

      - name: Resumo (versões e SHA-256 dos JSON exportados)
        env:
          TRIGGER: ${{ inputs.trigger }}
          MATCH_IDS: ${{ inputs.match_ids }}
        run: |
          predictions="_site/data/api/seasons/$SEASON/predictions.json"
          {
            echo "### publish-site"
            echo "- commit: $GITHUB_SHA"
            echo "- gatilho: ${TRIGGER:-$GITHUB_EVENT_NAME}; jogos: ${MATCH_IDS:-nenhum}"
            echo "- temporada: $SEASON; semente: $SEED"
            echo "- simulações: atual $SIMULATIONS, histórico $HISTORY_SIMULATIONS, revisão $ROUND_REVIEW_SIMULATIONS"
            echo "- reference_date: $(jq -r '.reference_date' "$predictions")"
            echo "- model_version: $(jq -r '.model.model_version' "$predictions")"
            echo "- data_version: $(jq -r '.data.version' "$predictions")"
            echo "- publicação ligada: ${{ vars.PUBLISH_ENABLED == 'true' }}"
            if [ -f _site/serie-b/data/forecast.json ]; then
              echo "- Série B: referência $(jq -r '.reference_date' _site/serie-b/data/forecast.json), dados $(jq -r '.data_version' _site/serie-b/data/forecast.json), passo ${{ steps.serie_b.outcome }}"
            else
              echo "- Série B: fora do artefato"
            fi
            for league in premier-league la-liga; do
              if [ -f "_site/$league/data/forecast.json" ]; then
                echo "- $league: referência $(jq -r '.reference_date' "_site/$league/data/forecast.json"), dados $(jq -r '.data_version' "_site/$league/data/forecast.json")"
              else
                echo "- $league: fora do artefato"
              fi
            done
            echo ""
            echo "SHA-256 dos JSON exportados:"
            echo ""
            echo '```text'
            (cd _site && find data serie-b/data premier-league/data la-liga/data -name '*.json' -type f 2>/dev/null | sort | xargs sha256sum)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Visibilidade lida da API com o GITHUB_TOKEN (só leitura), o que vale em todo evento. Se a API
      # falhar, o repositório é tratado como público e o artefato não sobe.
      - name: Visibilidade do repositório
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private' 2>/dev/null || true)"
          [ "$private" = "true" ] || private=false
          echo "repositório privado: $private"
          echo "private=$private" >> "$GITHUB_OUTPUT"

      # Em repositório público, artefatos podem ser baixados por terceiros: só sobe o site se ele for
      # ao ar nesta execução, ou se o repositório ainda for privado (ensaio C5).
      - name: Enviar o artefato do Pages
        if: vars.PUBLISH_ENABLED == 'true' || steps.visibility.outputs.private == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
