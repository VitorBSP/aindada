name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api,sources,dev]"
      - run: ruff check src apps tests scripts
      - run: ruff format --check src apps tests scripts
      - run: mypy
      - run: pytest -q
