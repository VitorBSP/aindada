# Qualidade do código: sem segredos e sem dados reais (só arquivos versionados e fixtures sintéticas).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api,sources,dev]"
      - run: ruff check src apps tests scripts infrastructure
      - run: ruff format --check src apps tests scripts infrastructure
      - run: mypy
      - run: pytest -q
