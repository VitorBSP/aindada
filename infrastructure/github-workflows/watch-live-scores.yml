# Atualiza placares ao vivo da Série A no Supabase (`live_round_scores`) via football-data.org.
#
# Disparado manualmente (`workflow_dispatch`) na branch `main` com `PUBLISH_ENABLED=true`.
# Usa apenas a biblioteca padrão do Python (`scripts/update_live_scores.py --watch`), sem precisar
# instalar dependências: começa a consultar em segundos e encerra com código 0 ao fim da janela.
name: watch-live-scores

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duração máxima do monitoramento em minutos (1 a 300)"
        required: false
        default: "140"
      interval_seconds:
        description: "Intervalo entre consultas em segundos (15 a 120)"
        required: false
        default: "30"
      once:
        description: "Fazer apenas uma consulta e encerrar"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: watch-live-scores
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 310
    permissions:
      contents: read
    steps:
      - name: Conferir os inputs
        env:
          DURATION_INPUT: ${{ inputs.duration_minutes }}
          INTERVAL_INPUT: ${{ inputs.interval_seconds }}
        run: |
          [[ "$DURATION_INPUT" =~ ^[0-9]+$ ]] && (( DURATION_INPUT >= 1 && DURATION_INPUT <= 300 )) || { echo "duration_minutes inválido (1 a 300)"; exit 1; }
          [[ "$INTERVAL_INPUT" =~ ^[0-9]+$ ]] && (( INTERVAL_INPUT >= 15 && INTERVAL_INPUT <= 120 )) || { echo "interval_seconds inválido (15 a 120)"; exit 1; }
          echo "duração=${DURATION_INPUT}m; intervalo=${INTERVAL_INPUT}s"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Monitorar placares ao vivo
        env:
          DURATION_INPUT: ${{ inputs.duration_minutes }}
          INTERVAL_INPUT: ${{ inputs.interval_seconds }}
          ONCE_INPUT: ${{ inputs.once }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUTF8: "1"
        run: |
          if [[ "$ONCE_INPUT" == "true" ]]; then
            python -I -u scripts/update_live_scores.py --watch --interval "$INTERVAL_INPUT" --once
            exit 0
          fi
          set +e
          timeout --signal=INT "${DURATION_INPUT}m" python -I -u scripts/update_live_scores.py --watch --interval "$INTERVAL_INPUT"
          code=$?
          set -e
          if [[ "$code" -eq 0 || "$code" -eq 124 || "$code" -eq 130 ]]; then
            echo "monitoramento encerrado após janela configurada (código $code)"
            exit 0
          fi
          exit "$code"
